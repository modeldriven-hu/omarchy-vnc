[workspace]
members = ["crates/omarchy-vnc-core", "crates/omarchy-vnc-egui", "crates/omarchy-vnc-gtk", "crates/omarchy-vnc-tui"]
default-members = ["crates/omarchy-vnc-core", "crates/omarchy-vnc-egui"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-2.0-or-later"
rust-version = "1.92"

[workspace.dependencies]
omarchy-vnc-core = { path = "crates/omarchy-vnc-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omarchy-vnc-tui = { path = "crates/omarchy-vnc-tui" }
